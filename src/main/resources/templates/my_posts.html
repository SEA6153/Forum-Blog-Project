<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        lang="en"
>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE-edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <link href="css/body.css" type="text/css" rel="stylesheet" />
    <link href="css/header.css" type="text/css" rel="stylesheet" />
    <link href="css/footer.css" type="text/css" rel="stylesheet" />
    <link href="css/footerimp.css" type="text/css" rel="stylesheet" />
    <title>BLOG :: Posts</title>
    <link type="text/html" />

</head>
<body>
<header>
    <div class="header">
        <div class="headerInner1">
            <button
                    class="btn"
                    type="button"
                    id="homeButton"
                    onclick="window.location.href='/home'"
            >
                <strong>HOME</strong>
            </button>
        </div>
        <div class="headerInner2"></div>
        <div class="headerInner5">
            <button
                    class="headerbutton2"
                    id="contactButton"
                    style="display: none"
            >
                <span>Contact</span><i></i>
            </button>
        </div>
        <div class="headerInner3" sec:authorize="isAuthenticated()">
            <a
                    sec:authorize="isAuthenticated()"
                    th:href="@{/my/posts}"
                    class="headerbutton1"
                    id="mypostsButton"
            >
                <span>My Posts</span>
                <i></i>
            </a>
        </div>
        <div class="headerInner4" sec:authorize="isAuthenticated()">
            <a
                    sec:authorize="isAuthenticated()"
                    th:href="@{/my/comments}"
                    class="headerbutton1"
                    id="mycommentsButton"
            >
                <span>My Comments</span>
                <i></i>
            </a>
        </div>
        <div class="headerInner4">
            <a th:href="@{/posts}" class="headerbutton1">
                <span>Discussion Form</span><i></i>
            </a>
        </div>
        <div class="headerInner6">
            <div class="userProfile" sec:authorize="isAuthenticated()">
                <a
                        th:if="${loggedInUsername.nickname != null}"
                        th:href="@{'/user/' + ${loggedInUsername.nickname} + '/profile'}"
                >
                    <button class="myprofileButton" id="myprofileButton">
                        <img
                                th:src="${loggedInUsername.userProfilePic != null ? loggedInUsername.userProfilePic : '/img/user-profile-icon-free-vector.jpg'}"
                                alt="Profile Picture"
                                class="profile-pic"
                        />

                        <span class="myprofileText">My Profile</span>
                    </button>
                </a>
            </div>
            <div class="userProfileName" th:if="${loggedInUsername.nickname != null}">
                <label class="hiLabel"
                >Hi,
                    <span th:text="${loggedInUsername.nickname}">Username</span></label
                >
            </div>
        </div>
        <div class="headerInner7" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button class="logoutButton" type="submit">

                    <div class="logoutText">Logout</div>
                </button>
            </form>
        </div>
    </div>
</header>

<div class="bodycontainerMyPost">
    <h1>My Posts</h1>
    <div class="container">
        <div th:if="${userPosts.isEmpty()}">
            <p>You have not created any posts yet.</p>
        </div>
        <!-- Form for Sorting and Searching -->
        <form id="postForm" th:action="@{/my/posts}" method="get">
            <!-- Sorting Options -->
            <div class="sorting-options">
                <label for="sortOption">Sort By:</label>
                <select id="sortOption" name="sortOption" onchange="sortPosts()">
                    <option
                            value="createdAt_desc"
                            th:selected="${sortField == 'createdAt' and sortDirection == 'desc'}"
                    >
                        Newest First
                    </option>
                    <option
                            value="createdAt_asc"
                            th:selected="${sortField == 'createdAt' and sortDirection == 'asc'}"
                    >
                        Oldest First
                    </option>
                    <option
                            value="likes_asc"
                            th:selected="${sortField == 'likes' and sortDirection == 'asc'}"
                    >
                        Most Liked
                    </option>
                    <option
                            value="likes_desc"
                            th:selected="${sortField == 'likes' and sortDirection == 'desc'}"
                    >
                        Least Liked
                    </option>
                </select>
            </div>

            <!-- Search Box -->
            <div class="search-box">
                <label for="searchQuery">Search:</label>
                <input
                        type="text"
                        id="searchQuery"
                        name="searchQuery"
                        th:value="${query}"
                />
                <button type="button" onclick="searchPosts()">Search</button>
            </div>

            <!-- Category Filter -->
            <div class="category-filter">
                <label  for="category">Category:</label>
                <select id="category" name="category" onchange="sortPosts()">
                    <option
                            value="all"
                            th:selected="${category == null or category.name() == 'ALL'}"
                    >
                        All
                    </option>
                    <option
                            th:each="cat : ${categories}"
                            th:value="${cat.name()}"
                            th:text="${cat.name()}"
                            th:selected="${category != null and category.name() == cat.name()}"
                    ></option>
                </select>
            </div>
        </form>

        <!-- Posts List -->
        <div th:each="post : ${userPosts}" class="post">
            <div class="post-info">
                <a
                        th:href="@{'/user/' + ${post.userAccount.nickname} + '/profile'}"
                        style="text-decoration: none; color: inherit"
                >
                    <a
                            th:href="@{'/user/' + ${post.userAccount.nickname} + '/profile'}"
                    >
                        <img style="
            border-radius: 50%;
            margin-top: 30px;
            height: 60px;
            width: 60px;
        " th:src="${post.userAccount.userProfilePic != null ? post.userAccount.userProfilePic : '/img/user-profile-icon-free-vector.jpg'}" alt="Profile Picture" class="profile-pic"/>

                    </a>
                    <div>
                        <h5 style="margin-bottom: 1px; font-size: 15px" th:text="${post.userAccount.nickname}">
                            Kullanıcı Adı
                        </h5>
                        <span style="font-size: 13px" th:text="${post.userAccount.roles[0]}">Role</span>
                    </div>
                </a>
            </div>
            <h2 th:text="${post.title}">Post Title</h2>
            <img
                    th:if="${post.imageUrl != null}"
                    th:src="@{${post.imageUrl}}"
                    alt="Post Image"
                    style="max-width: 500px; height: 325px"
            />
            <p th:text="${post.explanation}">Post Explanation</p>
            <p style="color:#cbcbcb;font-size: 14px" >Category: <span  style="color:#cbcbcb; font-size: 14px" th:text="${post.category}">Post Category</span></p>
            <h5 style="color: #d3d3d3; font-size: 12px"
                    th:text="${post.createdAt != null ? 'Post Created ' + post.timeAgo : 'Creation date not available'}"
            >
                Created at
            </h5>
            <span th:text="'Likes: ' + ${post.likeCount}">0</span>
            <span th:text="'Dislikes: ' + ${post.dislikeCount}">0</span>
            <div
                    class="actions"
                    th:if="${post.userAccount.id} == ${userAccountId}"
            >
                <a th:href="@{'/posts/' + ${post.id} + '/edit'}">Edit</a>
                <form
                        th:action="@{'/posts/' + ${post.id} + '/delete'}"
                        method="POST"
                        style="display: inline"
                >
                    <button class="buttonMypost" type="submit">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript" src="script.js"></script>
</body>
</html>
