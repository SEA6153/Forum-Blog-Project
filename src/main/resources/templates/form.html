<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        lang="tr"
>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BLOG :: Posts</title>
    <link href="/css/form.css" rel="stylesheet" type="text/css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <script>
        function sortPosts() {
            document.getElementById('postForm').submit()
        }

        function searchPosts() {
            document.getElementById('postForm').submit()
        }
        
        // Theme switcher
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            
            // Kayıtlı temayı kontrol et
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            // Theme toggle butonu tıklama olayı
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });

            // Profil dropdown menüsü için
            const profileContainer = document.querySelector('.profile-container');
            const dropdownContent = document.querySelector('.profile-dropdown-content');

            if (profileContainer && dropdownContent) {
                profileContainer.addEventListener('click', (e) => {
                    e.stopPropagation();
                    profileContainer.classList.toggle('active');
                });

                // Sayfa herhangi bir yerine tıklandığında menüyü kapat
                document.addEventListener('click', () => {
                    profileContainer.classList.remove('active');
                });

                // Dropdown içine tıklandığında menüyü kapatma
                dropdownContent.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            }
        });
    </script>
</head>
<body>
<header>
    <div class="container">
        <nav>
            <a href="/home" class="logo-link">
                <img th:src="@{/img/seaLogo.png}" alt="SEA Logo" class="logo">
            </a>
            <div class="nav-links">
                <a href="/home" class="nav-link">Ana Sayfa</a>
                <a href="/posts" class="nav-link">Forum</a>
                <a href="/blog" class="nav-link">Blog</a>
                <a href="/about" class="nav-link">Hakkında</a>
            </div>
            <div class="user-section">
                <div sec:authorize="isAuthenticated()" class="user-links">
                    <a th:href="@{/my/posts}" class="nav-link">
                        <i class="fas fa-file-alt fa-sm"></i>
                        Gönderilerim
                    </a>
                    <a th:href="@{/my/comments}" class="nav-link">
                        <i class="fas fa-comments fa-sm"></i>
                        Yorumlarım
                    </a>
                </div>
                <div class="profile-container" th:if="${userAccount != null}">
                    <button class="profile-dropdown-btn">
                        <img th:src="${userAccount.userProfilePic != null ? userAccount.userProfilePic : '/img/user-profile-icon-free-vector.jpg'}"
                             alt="Profil" class="profile-image"/>
                        <span class="username" th:text="${userAccount.nickname}">Kullanıcı</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="profile-dropdown-content">
                        <a th:href="@{'/user/' + ${userAccount.nickname} + '/profile'}" class="dropdown-item">
                            <i class="fas fa-user"></i>
                            Profilim
                        </a>
                        <a href="/settings" class="dropdown-item">
                            <i class="fas fa-cog"></i>
                            Ayarlar
                        </a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item logout-item">
                                <i class="fas fa-sign-out-alt"></i>
                                Çıkış Yap
                            </button>
                        </form>
                    </div>
                </div>
                <div class="auth-buttons" sec:authorize="!isAuthenticated()">
                    <a href="/login" class="login-button">
                        <i class="fas fa-sign-in-alt"></i>
                        Giriş Yap
                    </a>
                    <a href="/register" class="signup-button">
                        <i class="fas fa-user-plus"></i>
                        Kayıt Ol
                    </a>
                </div>
                <div class="theme-switch">
                    <button class="theme-toggle" id="theme-toggle" title="Tema değiştir">
                        <i class="fas fa-sun light-icon"></i>
                        <i class="fas fa-moon dark-icon"></i>
                    </button>
                </div>
            </div>
        </nav>
    </div>
</header>

<main class="form-container">
    <div class="content">
        <form id="postForm" action="/posts" method="get" class="search-form">
            <div class="form-layout">
                <div class="form-left">
                    <div class="form-group">
                        <label for="sortOption" class="form-label">
                            <i class="fas fa-sort"></i>
                            Sırala:
                        </label>
                        <select id="sortOption" name="sortOption" onchange="sortPosts()" class="form-select">
                            <option value="createdAt_desc" th:selected="${sortField == 'createdAt' and sortDirection == 'desc'}">En Yeni</option>
                            <option value="createdAt_asc" th:selected="${sortField == 'createdAt' and sortDirection == 'asc'}">En Eski</option>
                            <option value="likes_asc" th:selected="${sortField == 'likes' and sortDirection == 'asc'}">En Çok Beğenilen</option>
                            <option value="likes_desc" th:selected="${sortField == 'likes' and sortDirection == 'desc'}">En Az Beğenilen</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="category" class="form-label">
                            <i class="fas fa-tag"></i>
                            Kategori:
                        </label>
                        <select id="category" name="category" onchange="sortPosts()" class="form-select">
                            <option value="" hidden="">Kategori Seçin</option>
                            <option value="all" th:selected="${category == null or category.name() == 'ALL'}">Tümü</option>
                            <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.getCategoryNames()}"></option>
                        </select>
                    </div>
                </div>
                
                <div class="form-right">
                    <div class="search-group">
                        <input type="text" id="searchQuery" name="searchQuery" placeholder="Ara..." th:value="${query}" class="form-input"/>
                        <button type="submit" class="home-button">
                            <i class="fas fa-search"></i>
                            Ara
                        </button>
                        <a sec:authorize="isAuthenticated()" th:href="@{/posts/new}" class="new-post-button">
                            Yeni Gönderi
                            <i class="fas fa-plus-circle"></i>
                        </a>
                    </div>
                </div>
            </div>
        </form>

        <div class="posts-container">
            <div th:each="post : ${post}" class="post-card">
                <div class="post-content">
                    <div class="post-header">
                        <a th:href="@{'/user/' + ${post.userAccount.nickname} + '/profile'}" class="user-avatar">
                            <img th:src="${post.userAccount.userProfilePic != null ? post.userAccount.userProfilePic : '/img/user-profile-icon-free-vector.jpg'}"
                                 class="profile-image" alt="User Profile Picture"/>
                        </a>
                        <div class="user-info">
                            <a th:href="@{'/user/' + ${post.userAccount.nickname} + '/profile'}" 
                               class="username" th:text="${post.userAccount.nickname}">
                                Kullanıcı Adı
                            </a>
                            <span th:if="${post.userAccount.roles != null and #lists.size(post.userAccount.roles) > 0}"
                                  class="user-role" th:text="${post.userAccount.roles[0]}">
                            </span>
                        </div>
                    </div>

                    <h2 class="post-title">
                        <a th:href="@{'/posts/' + ${post.id}}" th:text="${post.title}">Başlık</a>
                    </h2>

                    <p class="post-text" th:text="${post.explanation}">Açıklama</p>

                    <img th:if="${post.imageUrl != null}" th:src="@{${post.imageUrl}}" 
                         class="post-image" alt="Post Image"/>

                    <div class="post-meta">
                        <span>
                            <i class="fas fa-tag"></i>
                            <span th:text="${post.category}"></span>
                        </span>
                        <span>
                            <i class="far fa-clock"></i>
                            <span th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'dd-MM-yyyy HH:mm') : 'Creation date not available'}">
                            </span>
                        </span>
                        <span>
                            <i class="fas fa-thumbs-up"></i>
                            <span th:text="${post.likeCount}">0</span>
                            <i class="fas fa-thumbs-down ml-2"></i>
                            <span th:text="${post.dislikeCount}">0</span>
                        </span>
                    </div>
                </div>

                <div class="action-buttons">
                    <form sec:authorize="isAuthenticated()" th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
                        <button type="submit" class="like-button">
                            <i class="fas fa-thumbs-up"></i>
                            <span th:text="${userAccount != null && post.likes.contains(userAccount) ? 'Unlike' : 'Like'}"></span>
                            <span class="count" th:text="${post.likeCount}">0</span>
                        </button>
                    </form>

                    <form sec:authorize="isAuthenticated()" th:action="@{/posts/{id}/dislike(id=${post.id})}" method="post">
                        <button type="submit" class="dislike-button">
                            <i class="fas fa-thumbs-down"></i>
                            <span th:text="${userAccount != null && post.dislikes.contains(userAccount) ? 'Undislike' : 'Dislike'}"></span>
                            <span class="count" th:text="${post.dislikeCount}">0</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <div class="footer-content">
            <div class="footer-left">
                <div class="social-links">
                    <a href="https://twitter.com" target="_blank" class="social-link">
                        <i class="fab fa-twitter fa-2x"></i>
                    </a>
                    <a href="https://facebook.com" target="_blank" class="social-link">
                        <i class="fab fa-facebook fa-2x"></i>
                    </a>
                    <a href="https://instagram.com" target="_blank" class="social-link">
                        <i class="fab fa-instagram fa-2x"></i>
                    </a>
                    <a href="https://linkedin.com" target="_blank" class="social-link">
                        <i class="fab fa-linkedin fa-2x"></i>
                    </a>
                    <a href="https://github.com" target="_blank" class="social-link">
                        <i class="fab fa-github fa-2x"></i>
                    </a>
                </div>
                <div class="made-by">
                    <span>Made by</span>
                    <span class="sea-text">SEA</span>
                </div>
            </div>
            
            <div class="copyright">
                <p>&copy; 2025 Forum Platform. Tüm hakları saklıdır.</p>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
