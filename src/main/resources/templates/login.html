<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/security/tags">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Forum Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="/home" class="logo-link">
                    <img th:src="@{/img/seaLogo.png}" alt="SEA Logo" class="logo">
                </a>
                <div class="nav-links">
                    <a href="/home" class="nav-link">Ana Sayfa</a>
                    <a href="/posts" class="nav-link">Forum</a>
                    <a href="/blog" class="nav-link">Blog</a>
                    <a href="/about" class="nav-link">Hakkında</a>
                </div>
                <div class="theme-switch">
                    <button class="theme-toggle" id="theme-toggle" title="Tema değiştir">
                        <i class="fas fa-sun light-icon"></i>
                        <i class="fas fa-moon dark-icon"></i>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1>Hoş Geldiniz!</h1>
                    <p>Hesabınıza giriş yapın ve topluluğa katılın.</p>
                </div>

                <form th:action="@{/login}" method="post" class="login-form">
                    <div th:if="${param.error}" class="alert alert-error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Hatalı e-posta veya şifre!</span>
                    </div>
                    
                    <div th:if="${param.logout}" class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        <span>Başarıyla çıkış yaptınız.</span>
                    </div>

                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i>
                            E-posta Adresi
                        </label>
                        <input type="email" id="email" name="username" required 
                               placeholder="E-posta adresinizi girin">
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i>
                            Şifre
                        </label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" required 
                                   placeholder="Şifrenizi girin">
                            <button type="button" class="toggle-password" title="Şifreyi göster/gizle">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember-me">
                            <span>Beni hatırla</span>
                        </label>
                        <a href="/forgot-password" class="forgot-password">Şifremi unuttum</a>
                    </div>

                    <button type="submit" class="login-button">
                        <i class="fas fa-sign-in-alt"></i>
                        Giriş Yap
                    </button>
                </form>

                <div class="register-link">
                    <p>Henüz hesabınız yok mu?</p>
                    <a href="/register" class="register-button">
                        <i class="fas fa-user-plus"></i>
                        Hesap Oluştur
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-left">
                    <div class="social-links">
                        <a href="https://twitter.com" target="_blank" class="social-link">
                            <i class="fab fa-twitter fa-2x"></i>
                        </a>
                        <a href="https://facebook.com" target="_blank" class="social-link">
                            <i class="fab fa-facebook fa-2x"></i>
                        </a>
                        <a href="https://instagram.com" target="_blank" class="social-link">
                            <i class="fab fa-instagram fa-2x"></i>
                        </a>
                        <a href="https://linkedin.com" target="_blank" class="social-link">
                            <i class="fab fa-linkedin fa-2x"></i>
                        </a>
                        <a href="https://github.com" target="_blank" class="social-link">
                            <i class="fab fa-github fa-2x"></i>
                        </a>
                    </div>
                    <div class="made-by">
                        <span>Made by</span>
                        <span class="sea-text">SEA</span>
                    </div>
                </div>
                
                <div class="copyright">
                    <p>&copy; 2025 Forum Platform. Tüm hakları saklıdır.</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Tema değiştirme işlevi
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            body.setAttribute('data-theme', currentTheme);
        }
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Şifre göster/gizle işlevi
        const togglePassword = document.querySelector('.toggle-password');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
