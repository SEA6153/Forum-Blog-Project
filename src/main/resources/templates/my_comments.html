<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE-edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <link href="css/body.css" type="text/css" rel="stylesheet" />
    <link href="css/header.css" type="text/css" rel="stylesheet" />
    <link href="css/footer.css" type="text/css" rel="stylesheet" />
    <link href="css/footerimp.css" type="text/css" rel="stylesheet" />
    <title>Projects</title>
        <script type="text/javascript">
            function sortPosts() {
                document.getElementById("postForm").submit();
            }

            function searchPosts() {
                document.getElementById("postForm").submit();
            }
        </script>
</head>
<body>
<header>
    <div class="header">
        <div class="headerInner1">
            <button
                    class="btn"
                    type="button"
                    id="homeButton"
                    onclick="window.location.href='/home'"
            >
                <strong>HOME</strong>
            </button>
        </div>
        <div class="headerInner2"></div>
        <div class="headerInner5">
            <button
                    class="headerbutton2"
                    id="contactButton"
                    style="display: none"
            >
                <span>Contact</span><i></i>
            </button>
        </div>
        <div class="headerInner3" sec:authorize="isAuthenticated()">
            <a sec:authorize="isAuthenticated()" th:href="@{/my/posts}" class="headerbutton1" id="mypostsButton">
                <span>My Posts</span>
                <i></i>
            </a>
        </div>
        <div class="headerInner4" sec:authorize="isAuthenticated()">
            <a sec:authorize="isAuthenticated()" th:href="@{/my/comments}" class="headerbutton1" id="mycommentsButton">
                <span>My Comments</span>
                <i></i>
            </a>
        </div>
        <div class="headerInner4">
            <a th:href="@{/posts}" class="headerbutton1">
                <span>Discussion Form</span><i></i>

            </a>
        </div>
        <div class="headerInner6">
            <div class="userProfile" sec:authorize="isAuthenticated()">
                <a th:if="${userAccount != null}" th:href="@{'/user/' + ${userAccount.nickname} + '/profile'}">
                    <button class="myprofileButton" id="myprofileButton">
                        <img th:src="${userAccount.userProfilePic != null ? userAccount.userProfilePic : '/img/user-profile-icon-free-vector.jpg'}" alt="Profile Picture" class="profile-pic"/>

                        <span class="myprofileText">My Profile</span>
                    </button>
                </a>
            </div>
            <div class="userProfileName" th:if="${userAccount != null}">
                <label class="hiLabel">Hi, <span th:text="${userAccount.nickname}">Username</span></label>
            </div>
        </div>
        <div class="headerInner7" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button class="logoutButton" type="submit">
                    <div class="logoutText">Logout</div>
                </button>
            </form>
        </div>
    </div>
</header>

<div class="commentContainer">
<div class="bodycontainerComments">
    <h1>My Comments</h1>
    <div th:if="${userComments.isEmpty()}" class="no-comments">
        <p>You have not commented yet.</p>
    </div>
    <form  id="postForm" th:action="@{/my/comments}" method="get">
        <div class="sorting-options">
            <label for="sortOption">Sort By:</label>
            <select id="sortOption" name="sortOption" onchange="sortPosts()">
                <option value="createdAt_desc" th:selected="${sortField == 'createdAt' and sortDirection == 'desc'}">Newest First</option>
                <option value="createdAt_asc" th:selected="${sortField == 'createdAt' and sortDirection == 'asc'}">Oldest First</option>
                <option value="likes_desc" th:selected="${sortField == 'likes' and sortDirection == 'desc'}">Most Liked</option>
                <option value="likes_asc" th:selected="${sortField == 'likes' and sortDirection == 'asc'}">Least Liked</option>
            </select>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <label for="searchQuery">Search:</label>
            <input type="text" id="searchQuery" name="searchQuery" th:value="${query}">
            <button type="button" class="buttonreg" onclick="searchPosts()">Search</button>
        </div>

        <!-- Category Filter -->
        <div class="category-filter">
            <label for="category">Category:</label>
            <select id="category" name="category" onchange="sortPosts()">
                <option value="all" th:selected="${category == null or category.name() == 'ALL'}">All</option>
                <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.name()}" th:selected="${category != null and category.name() == cat.name()}"></option>
            </select>
        </div>
    </form>
    <div th:each="comment : ${userComments}" class="comment">
        <div class="comment-header">
            <div class="user-info">
                <a th:href="@{'/user/' + ${comment.userAccount.nickname} + '/profile'}">
                    <img th:src="${comment.userAccount.userProfilePic != null ? comment.userAccount.userProfilePic : '/img/user-profile-icon-free-vector.jpg'}" alt="Profile Picture" class="profile-pic"/>
                </a>
                <div class="user-details">
                    <h5 th:text="${comment.userAccount.nickname}">Kullanıcı Adı</h5>
                    <h6 th:text="${comment.userAccount.roles[0]}"></h6>
                </div>

            </div>
        </div>
        <div class="comment-content">
            <a th:href="@{'/posts/' + ${comment.post.id}}" th:text="${comment.post.title}">Gönderi Başlığı</a>
            <p th:text="'Comment: ' + ${comment.text}">Yorum Metni</p>
            <div th:if="${comment.photoUrl != null}">
                <img style="max-width: 100%; height: auto;" th:src="@{${comment.photoUrl}}" alt="Yorum Fotoğrafı">
            </div>
        </div>
        <div class="comment-metadata">
            <span th:text="'Likes: ' + ${comment.post.likeCount}"></span>
        </div>
        <div class="comment-metadata">
            <span th:text="'Dislikes: ' + ${comment.post.dislikeCount}"></span>
        </div>
        <div class="comment-metadata2">
            <span th:text="'Category: ' + ${comment.post.category}"></span>

        </div>
        <div class="comment-metadata2">
            <span th:text="'Created at: ' + ${#temporals.format(comment.createdAt, 'dd-MM-yyyy HH:mm')}"></span>
        </div>
        <div class="comment-actions" th:if="${comment.userAccount.id == userAccountId}">
            <form th:action="@{'/my/comments/' + ${comment.id} + '/edit'}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${comment.id}" />
                <textarea name="text" required th:text=" ${comment.text}"></textarea>
                <input type="file" name="photo" accept="image/*">
                <button class="buttonreg" type="submit">Edit</button>
            </form>
            <form th:action="@{/my/comments/delete}" method="post" style="display: inline;">
                <input type="hidden" name="id" th:value="${comment.id}" />
                <button class="buttonreg" type="submit">Delete</button>
            </form>
        </div>
    </div>

    <div th:if="${!isLoggedIn}" class="not-logged-in">
        <p>Yorum yazmak ve fotoğraf yüklemek için lütfen giriş yapın.</p>
    </div>
</div>
</div>

<script type="text/javascript" src="script.js"></script>
</body>
</html>
