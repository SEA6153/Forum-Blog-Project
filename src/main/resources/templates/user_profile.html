<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        lang="en"
>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE-edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <link href="css/body.css" type="text/css" rel="stylesheet" />
    <link href="css/header.css" type="text/css" rel="stylesheet" />
    <link href="css/footer.css" type="text/css" rel="stylesheet" />
    <link href="css/footerimp.css" type="text/css" rel="stylesheet" />
    <title>Projects</title>
</head>
<body>
<header>
    <div class="header">
        <div class="headerInner1">
            <button
                    class="btn"
                    type="button"
                    id="homeButton"
                    onclick="window.location.href='/home'"
            >
                <strong>HOME</strong>
            </button>
        </div>
        <div class="headerInner2"></div>
        <div class="headerInner5">
            <button
                    class="headerbutton2"
                    id="contactButton"
                    style="display: none"
            >
                <span>Contact</span><i></i>
            </button>
        </div>
        <div class="headerInner3" sec:authorize="isAuthenticated()">
            <a
                    sec:authorize="isAuthenticated()"
                    th:href="@{/my/posts}"
                    class="headerbutton1"
                    id="mypostsButton"
            >
                <span>My Posts</span>
                <i></i>
            </a>
        </div>
        <div class="headerInner4" sec:authorize="isAuthenticated()">
            <a
                    sec:authorize="isAuthenticated()"
                    th:href="@{/my/comments}"
                    class="headerbutton1"
                    id="mycommentsButton"
            >
                <span>My Comments</span>
                <i></i>
            </a>
        </div>
        <div class="headerInner4">
            <a th:href="@{/posts}" class="headerbutton1">
                <span>Discussion Form</span><i></i>
            </a>
        </div>
        <div class="headerInner6">
            <div class="userProfile" sec:authorize="isAuthenticated()">
                <a
                        th:if="${loggedInuser != null}"
                        th:href="@{'/user/' + ${loggedInuser.nickname} + '/profile'}"
                >
                    <button class="myprofileButton" id="myprofileButton">
                        <img
                                th:src="${loggedInuser.userProfilePic != null ? loggedInuser.userProfilePic : '/img/user-profile-icon-free-vector.jpg'}"
                                alt="Profile Picture"
                                class="profile-pic"
                        />

                        <span class="myprofileText">My Profile</span>
                    </button>
                </a>
            </div>
            <div class="userProfileName" th:if="${loggedInuser != null}">
                <label class="hiLabel"
                >Hi,
                    <span th:text="${loggedInuser.nickname}">Username</span></label
                >
            </div>
        </div>
        <div class="headerInner7" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button class="logoutButton" type="submit">
                    <div class="logoutText">Logout</div>
                </button>
            </form>
        </div>
    </div>
</header>
<div class="bodycontainerUserProfile" style="z-index: 100; position: relative;" >
    <div class="container">
        <div class="img_container">
            <img th:src="${userAccount.userProfilePic != null ? userAccount.userProfilePic : '/img/user-profile-icon-free-vector.jpg'}" alt="Profile Picture" class="profile-pic"/>

        </div>
        <h2 style="color: #ff6f61; font-size: 19px" th:text=" ${userAccount.nickname}">--</h2>
        <h2 style="color: #ff6f61;font-size: 14px" th:text="${userAccount.roles[0]}"></h2>
        <div th:if="${isOwnProfile}">
            <form
                    method="post"
                    enctype="multipart/form-data"
                    th:action="@{'/user/' + ${userAccount.nickname} + '/profile'}"
            >
                <input type="file" name="file" required />
                <button class="buttonProfile" type="submit">Profil Resminizi Yükleyin</button>
            </form>
        </div>

    </div>
</div>
<script type="text/javascript" src="script.js"></script>
</body>
</html>
