<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/security/tags">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-posta Doğrulama - Forum Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        .countdown {
            font-size: 1.2rem;
            margin-top: 10px;
            text-align: center;
            color: #666;
        }
        
        .resend-button {
            background-color: #f0f0f0;
            color: #333;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .resend-button:hover {
            background-color: #e0e0e0;
        }
        
        .resend-button:disabled {
            background-color: #f0f0f0;
            color: #999;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="/home" class="logo-link">
                    <img th:src="@{/img/seaLogo.png}" alt="SEA Logo" class="logo">
                </a>
                <div class="nav-links">
                    <a href="/home" class="nav-link">Ana Sayfa</a>
                    <a href="/posts" class="nav-link">Forum</a>
                    <a href="/blog" class="nav-link">Blog</a>
                    <a href="/about" class="nav-link">Hakkında</a>
                </div>
                <div class="theme-switch">
                    <button class="theme-toggle" id="theme-toggle" title="Tema değiştir">
                        <i class="fas fa-sun light-icon"></i>
                        <i class="fas fa-moon dark-icon"></i>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1>E-posta Doğrulama</h1>
                    <p>Hesabınızı aktifleştirmek için e-posta adresinize gönderilen doğrulama kodunu girin.</p>
                </div>

                <div th:if="${successMessage}" class="alert alert-success">
                    <i class="fas fa-check-circle"></i>
                    <span th:text="${successMessage}"></span>
                </div>
                
                <div th:if="${errorMessage}" class="alert alert-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/verify-email}" method="post" class="login-form">
                    <input type="hidden" name="email" th:value="${email}">
                    
                    <div class="form-group">
                        <label for="verificationCode">
                            <i class="fas fa-key"></i>
                            Doğrulama Kodu
                        </label>
                        <input type="text" id="verificationCode" name="verificationCode" required 
                               placeholder="6 haneli doğrulama kodunu girin" maxlength="6" pattern="[0-9]{6}">
                    </div>

                    <button type="submit" class="login-button">
                        <i class="fas fa-check"></i>
                        Doğrula
                    </button>
                </form>

                <div class="countdown" id="countdown">Yeni kod isteyebilmek için kalan süre: <span id="timer">60</span> saniye</div>
                
                <form th:action="@{/resend-verification}" method="post">
                    <input type="hidden" name="email" th:value="${email}">
                    <button type="submit" class="resend-button" id="resendButton" disabled>
                        <i class="fas fa-paper-plane"></i>
                        Yeni Kod Gönder
                    </button>
                </form>
                
                <div class="register-link">
                    <p>Giriş sayfasına dönmek için</p>
                    <a href="/login" class="register-button">
                        <i class="fas fa-sign-in-alt"></i>
                        Giriş Yap
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-left">
                    <div class="social-links">
                        <a href="https://twitter.com" target="_blank" class="social-link">
                            <i class="fab fa-twitter fa-2x"></i>
                        </a>
                        <a href="https://facebook.com" target="_blank" class="social-link">
                            <i class="fab fa-facebook fa-2x"></i>
                        </a>
                        <a href="https://instagram.com" target="_blank" class="social-link">
                            <i class="fab fa-instagram fa-2x"></i>
                        </a>
                        <a href="https://linkedin.com" target="_blank" class="social-link">
                            <i class="fab fa-linkedin fa-2x"></i>
                        </a>
                        <a href="https://github.com" target="_blank" class="social-link">
                            <i class="fab fa-github fa-2x"></i>
                        </a>
                    </div>
                    <div class="made-by">
                        <span>Made by</span>
                        <span class="sea-text">SEA</span>
                    </div>
                </div>
                
                <div class="copyright">
                    <p>&copy; 2025 Forum Platform. Tüm hakları saklıdır.</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Tema değiştirme işlevi
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            body.setAttribute('data-theme', currentTheme);
        }
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Geri sayım işlevi
        let timeLeft = 60;
        const timerElement = document.getElementById('timer');
        const resendButton = document.getElementById('resendButton');
        
        function updateTimer() {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                resendButton.disabled = false;
                document.getElementById('countdown').style.display = 'none';
            } else {
                timerElement.textContent = timeLeft;
                timeLeft -= 1;
            }
        }
        
        const timerInterval = setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
